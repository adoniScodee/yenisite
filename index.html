<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOSES PLACE | Premium Tekstil & Moda</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="logo">
      <img src="assets/logo.png" alt="MOSES PLACE">
    </div>
    <div class="nav-links">
      <a href="#home">Ana Sayfa</a>
      <a href="#products">Ürünler</a>
      <a href="#about">Hakkımızda</a>
      <a href="#contact">İletişim</a>
    </div>
    <div class="lang">
      <button onclick="switchLang()">🇹🇷 TR | EN</button>
    </div>
  </nav>

  <!-- Hero -->
  <section id="home" class="hero">
    <div class="hero-content">
      <h1>MOSES PLACE</h1>
      <p id="hero-desc">Şıklığın ve Kalitenin Adresi</p>
      <div class="hero-buttons">
        <button class="btn" onclick="document.getElementById('products').scrollIntoView()">Ürünleri Keşfet</button>
        <button class="btn whatsapp" onclick="openWhatsApp()">
          <i class="fab fa-whatsapp"></i> WhatsApp ile Sipariş
        </button>
      </div>
    </div>
  </section>

  <!-- Products Section -->
  <section id="products" class="section">
    <h2 class="section-title">Öne Çıkan Ürünlerimiz</h2>
    <div class="products-grid">
      <!-- Ürünler buraya eklenecek -->
    </div>
  </section>

  <footer>
    <p>MOSES PLACE © 2026 | Tüm Hakları Saklıdır</p>
    <p>WhatsApp: <a href="https://wa.me/905309557011" target="_blank">+90 530 955 70 11</a></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
